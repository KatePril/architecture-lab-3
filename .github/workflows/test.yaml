name: Go Test

on:
  push:
    branches:
      - main
      - ci

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.24

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: |
          go mod tidy
          mkdir -p out
          go build -o out/painter ./cmd/painter

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-painter
          path: out/painter